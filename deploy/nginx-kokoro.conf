# Kokoro TTS behind nginx: TLS termination + a real access gate.
#
#   sudo cp deploy/nginx-kokoro.conf /etc/nginx/conf.d/kokoro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why this exists: the built-in KOKORO_API_KEY check reads a request header, and
# a browser cannot attach a custom header to a same-origin form post. Terminating
# TLS at nginx lets you gate the whole site with HTTP Basic auth instead, which
# the browser handles natively. The upstream stays on loopback and never sees
# the internet directly.

upstream kokoro_tts {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Rate limit per client IP. Synthesis is CPU-bound and single-worker, so this
# is what stops one caller from queueing the server for everyone else.
limit_req_zone $binary_remote_addr zone=kokoro_limit:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tts.example.com;

    # Certbot: redirect everything except the ACME challenge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tts.example.com;

    ssl_certificate     /etc/letsencrypt/live/tts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tts.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ---- access gate -----------------------------------------------------
    # This is what actually protects the web UI. Leave KOKORO_API_KEY unset in
    # /etc/kokoro/tts.env and let Basic auth be the only layer.
    auth_basic           "Kokoro TTS";
    auth_basic_user_file /etc/nginx/kokoro.htpasswd;

    # Generate the file:  sudo htpasswd -c /etc/nginx/kokoro.htpasswd kokoro

    # ---- rate limiting ---------------------------------------------------
    limit_req zone=kokoro_limit burst=5 nodelay;

    # ---- proxying --------------------------------------------------------
    client_max_body_size 2m;

    location / {
        proxy_pass         http://kokoro_tts;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health checks must not be authenticated, or an external monitor will
    # treat a 401 as a failure. Restrict it to localhost.
    location = /health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://kokoro_tts;
    }

    # Keep /docs and /openapi.json private: they describe your whole surface.
    location ~ ^/(docs|openapi\.json|redoc) {
        return 404;
    }
}
